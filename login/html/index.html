<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="container">
        <div class="form-box login">
            <form action="" id="loginForm">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <i class="bx bx-user bx-flip-horizontal" style="color:#ffffff;" />
                </div>
                <div class="input-box">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <i class="bx bx-lock bx-flip-horizontal" style="color:#ffffff;" />
                </div>
                <div class="forgot-link">
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <p>or login with social platforms</p>
                <p>or login with Google</p>

                <div id="g_id_onload"
                    data-client_id="810964176680-ac032frk21n9ufo8r3q9abfcgjctra9j.apps.googleusercontent.com"
                    data-callback="handleCredentialResponse">
                </div>

                <div class="g_id_signin"
                    data-type="standard"
                    data-size="large"
                    data-theme="outline"
                    data-text="signin_with"
                    data-shape="rectangular">
                </div>
            </form>
        </div>


        <div class="form-box register">
            <form action="" id="registerForm">
                <h1>Registration</h1>
                <div class="input-box">
                    <input type="text" id="registerUsername" placeholder="Username" required>
                    <i class="bx bx-user bx-flip-horizontal" style="color:#ffffff;" />
                </div>
                <div class="input-box">
                    <input type="email" id="registerEmail" placeholder="Email" required>
                    <i class="bx bx-user bx-flip-horizontal" style="color:#ffffff;" />
                </div>
                <div class="input-box">
                    <input type="password" id="registerPassword" placeholder="Password" required>
                    <i class="bx bx-lock bx-flip-horizontal" style="color:#ffffff;" />
                </div>
                <button type="submit" class="btn">Register</button>
                <p>or login register with social platforms</p>
                <p>or login with Google</p>

                <div id="g_id_onload"
                    data-client_id="125665884983-n1nfcmh6leu0g0fpcue24h13icrat1h4.apps.googleusercontent.com"
                    data-callback="handleCredentialResponse">
                </div>

                <div class="g_id_signin"
                    data-type="standard"
                    data-size="large"
                    data-theme="outline"
                    data-text="signin_with"
                    data-shape="rectangular">
                </div>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn">Register</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>
    

    <!-- <script src="/admin/js/app-core.js"></script> -->
    <script src="../js/main.js"></script>
</body>
</html>
